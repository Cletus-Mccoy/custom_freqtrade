<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:600px;width:95vw;">
  <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsModalLabel"><i class="fas fa-cog"></i> Global Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
  <div class="modal-body p-4 d-flex flex-column gap-4" style="overflow-y:auto;">
        <form id="settingsForm">
          <!-- Freqtrade API Key Management -->
  <div>
  <div class="card shadow-sm overflow-hidden">
                  <div class="card-header bg-secondary bg-gradient text-white d-flex align-items-center justify-content-between" style="cursor:pointer;" data-bs-toggle="collapse" data-bs-target="#apiKeyCollapse" aria-expanded="false" aria-controls="apiKeyCollapse">
            <span><i class="fas fa-key"></i> Freqtrade API Key Management</span>
            <button type="button" class="btn btn-light btn-sm ms-2" data-bs-toggle="modal" data-bs-target="#apiKeyModal"><i class="fas fa-plus"></i> Add Key</button>
          </div>
          <div id="apiKeyCollapse" class="collapse">
            <div class="card-body" style="background-color: #e0e3ea;">
              <div id="apiKeyList" class="mb-2"></div>
              <div id="apiKeyFeedback" class="mt-2"></div>
            </div>
          </div>
        </div>
      </div>


        <div class="d-flex gap-2 mt-3">
          <button type="submit" id="saveSettingsBtn" class="btn btn-primary flex-fill">Save Settings</button>
          <button type="button" class="btn btn-secondary flex-fill" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
      <div id="settingsFeedback" class="mt-2"></div>
    </div> <!-- END settingsModal modal-content/modal-dialog/modal -->
  </div>
</div>

<!-- Freqtrade API Key Add/Edit Modal (now outside main modal) -->
<div class="modal fade" id="apiKeyModal" tabindex="-1" aria-labelledby="apiKeyModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="apiKeyModalLabel"><i class="fas fa-key"></i> Add/Edit Freqtrade API Key</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="apiKeyForm">
          <div class="mb-3">
            <label for="ftKeyName" class="form-label">Key Name</label>
            <input type="text" class="form-control" id="ftKeyName" placeholder="e.g. binance_main" autocomplete="off">
          </div>
          <div class="mb-3">
            <label for="ftExchange" class="form-label">Exchange</label>
            <input type="text" class="form-control" id="ftExchange" placeholder="e.g. binance" autocomplete="off">
          </div>
          <div class="mb-3">
            <label for="ftApiKey" class="form-label">API Key</label>
            <input type="text" class="form-control" id="ftApiKey" placeholder="Enter API Key" autocomplete="off">
          </div>
          <div class="mb-3">
            <label for="ftApiSecret" class="form-label">API Secret</label>
            <input type="password" class="form-control" id="ftApiSecret" placeholder="Enter API Secret" autocomplete="off">
          </div>
        </form>
        <div id="apiKeyModalFeedback" class="mt-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="saveApiKeyBtn">Save API Key</button>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Simplified settings form - now only handles API keys
    var form = document.getElementById('settingsForm');
    if (form) {
      form.onsubmit = function(e) {
        e.preventDefault();
        var grouped = { global_settings: {} };
        var saveBtn = document.getElementById('saveSettingsBtn');
        saveBtn.disabled = true;
        var originalText = saveBtn.textContent;
        fetch('/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(grouped)
        })
        .then(resp => resp.json())
        .then((data) => {
          if (data.success === false || data.error) {
            throw new Error(data.error || 'Save failed');
          }
          saveBtn.classList.remove('btn-primary');
          saveBtn.classList.add('btn-success');
          saveBtn.textContent = 'Save Successful';
          setTimeout(function() {
            var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('settingsModal'));
            modal.hide();
            saveBtn.classList.remove('btn-success');
            saveBtn.classList.add('btn-primary');
            saveBtn.textContent = originalText;
            saveBtn.disabled = false;
          }, 900);
        })
        .catch((err) => {
          document.getElementById('settingsFeedback').innerHTML = '<div class="alert alert-danger">Failed to save settings.</div>';
          saveBtn.disabled = false;
        });
      };
    }
  });
        </script>
      </div>
    </div>
  </div>
</div>
