version: '3.8'
services:
  cloudflared-dev:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-dev
    restart: unless-stopped
    command: tunnel run ${TUNNEL_NAME}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    volumes:
      - ../cloudflared:/etc/cloudflared
    network_mode: host
